<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Outlandish – Log på</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#E7E8E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1F" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#E7E8E4; --surface:#FFFFFF; --ink:#1E2A34; --muted:#66727C; --line:#D3D6D1;
  --gold:#A87C22; --on-gold:#FFFFFF; --danger:#B3261E; --field:#F5F6F3;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141A1F; --surface:#1D252C; --ink:#E8EAE6; --muted:#98A2AA; --line:#2E3942;
    --gold:#D4A94B; --on-gold:#1A1406; --danger:#F2867E; --field:#172027;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
#login{display:flex;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:100%;max-width:380px}
.login-head{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px}
.word{margin:0;font:700 clamp(34px,11vw,46px)/1 Georgia,"Times New Roman",serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.sub{color:var(--muted);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
label.f{display:block;font-size:14px;color:var(--muted);margin:0 0 4px}
.mt{margin-top:12px}
.field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
.field:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.remember{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;cursor:pointer}
.remember input{width:22px;height:22px;accent-color:var(--gold);margin:0}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:8px 0 0}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:16px;cursor:pointer;min-height:50px;margin-top:14px}
.btn.primary{background:var(--gold);color:var(--on-gold);width:100%}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}
.login-head,.card{animation:riseIn .7s cubic-bezier(.16,1,.3,1) both}
.card{animation-delay:.15s}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.login-head,.card{animation:none}}
</style>
</head>
<body>
<section id="login" aria-label="Log på">
  <div class="login-box">
    <div class="login-head">
      <h1 class="word">Outlandish</h1>
      <div class="sub">Live · 22.–26. oktober 2026</div>
    </div>
    <form class="card" method="post" action="/login">
      <label class="f" for="lUser">Brugernavn</label>
      <input class="field" id="lUser" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="f mt" for="lPass">Password</label>
      <input class="field" id="lPass" name="pass" type="password" autocomplete="current-password" required>
      <label class="remember"><input type="checkbox" name="remember" checked> Husk mig på denne telefon</label>
      <p class="err" id="lErr" role="alert"></p>
      <button class="btn primary" type="submit">Log på</button>
      <p class="note">Har du ikke en bruger? Spørg Luke.</p>
    </form>
  </div>
</section>
<script>
  if (new URLSearchParams(location.search).has("fejl")) {
    document.getElementById("lErr").textContent = "Forkert brugernavn eller password";
  }
</script>
</body>
</html>
