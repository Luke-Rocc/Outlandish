name: Deploy til Cloudflare

on:
  push:
    branches: [claude/outlandish-live-2026-eggpi0]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d6f090279d53af41b915ef5a4e7f7b3b
          command: deploy
